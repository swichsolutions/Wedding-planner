<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <title>WeddingPlanner — დაგეგმე საკუთარი ქორწილი</title>
  <meta name="description" content="დაგეგმე საკუთარი ქორწილი მკაფიო გეგმით, საჭირო ადამიანებთან ერთად და ერთ სივრცეში თავმოყრილი ინფორმაციით — სივრცეები, მომსახურებები და ქორწილის დღის განრიგი.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Georgian-capable type: Noto Serif Georgian (display) + Noto Sans Georgian (body).
       Both cover Mkhedruli + Mtavruli + Latin so bilingual ka/en strings stay coherent.
       Loaded as VARIABLE fonts (full weight range + width axis) — the wedding-site
       themes draw their per-design typography from these axes. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Imagery CDN (placeholder photography) — preconnect to speed up LCP. -->
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <!-- Landing hero: preload the orientation-specific render (same files as the <picture> in home.html). -->
  <link rel="preload" as="image" href="/media/hero-wide.webp" type="image/webp" media="(orientation: landscape)">
  <link rel="preload" as="image" href="/media/hero-tall.webp" type="image/webp" media="(orientation: portrait)">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&family=Noto+Serif+Georgian:wght@100..900&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
