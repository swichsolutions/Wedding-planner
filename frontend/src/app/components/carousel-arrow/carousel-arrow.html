<button type="button" class="ca" [class.is-paused]="paused()" [attr.aria-label]="label()" (click)="next.emit()">
  <!-- the ring: a faint gold track, and the fill that runs round it while the carousel waits -->
  <svg class="ca__ring" viewBox="0 0 56 56" aria-hidden="true">
    <circle class="ca__track" cx="28" cy="28" r="26.5" />
    @if (interval() > 0) {
      <circle #fill class="ca__fill" cx="28" cy="28" r="26.5" pathLength="1" [style.animation-duration.ms]="interval()" />
    }
  </svg>
  <!-- a long thin arrow, not a chevron -->
  <svg class="ca__arrow" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3.5 12h16" />
    <path d="m14.5 6.5 5.5 5.5-5.5 5.5" />
  </svg>
</button>
