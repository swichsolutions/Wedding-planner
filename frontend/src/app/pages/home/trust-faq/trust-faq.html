<div class="faq">
  <header class="intro">
    <h2 class="title">{{ 'home.trust.title' | translate }}</h2>
    <p class="lead">{{ 'home.trust.lead' | translate }}</p>
  </header>

  <div class="carousel">
    <div
      class="stage"
      (pointerdown)="onDown($event)"
      (pointermove)="onMove($event)"
      (pointerup)="onUp($event)"
      (pointercancel)="onUp($event)"
      (mouseenter)="hover.set(true)"
      (mouseleave)="hover.set(false)"
      (focusin)="onFocus($event)"
      (focusout)="onBlur($event)"
      (keydown)="onKey($event)"
    >
      <ul class="cards" role="list">
        @for (q of questions; track q; let i = $index) {
          @let s = slot(i);
          @let turned = flipped() === i;
          <li class="item" [attr.data-s]="s" [attr.aria-hidden]="s !== 0">
            <button
              type="button"
              class="card"
              [class.is-flipped]="turned"
              [attr.aria-pressed]="turned"
              [attr.tabindex]="s === 0 ? 0 : -1"
              (click)="onCard(i)"
            >
              <span class="face front" [attr.aria-hidden]="turned">
                <span class="k">
                  <span>{{ 'home.trust.question' | translate }}</span>
                  <span>{{ i + 1 }}/{{ questions.length }}</span>
                </span>
                <span class="text">{{ 'home.trust.faq.q' + q | translate }}</span>
                <span class="hint">
                  <span class="ic" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
                  </span>
                  {{ 'home.trust.flipHint' | translate }}
                </span>
              </span>
              <span class="face back" [attr.aria-hidden]="!turned">
                <span class="k">
                  <span>{{ 'home.trust.answer' | translate }}</span>
                  <span>{{ i + 1 }}/{{ questions.length }}</span>
                </span>
                <span class="text">{{ 'home.trust.faq.a' + q | translate }}</span>
                <span class="hint">
                  <span class="ic" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><path d="M3 4v5h5"/></svg>
                  </span>
                  {{ 'home.trust.flipBack' | translate }}
                </span>
              </span>
            </button>
          </li>
        }
      </ul>

      <!-- the ring in the far right corner: fills while the cards wait, one card forward on click -->
      <app-car-arrow class="faq-arrow" [label]="'home.carousel.next' | translate" [interval]="4000"
        [paused]="hover() || focus() || flipped() !== null" [tick]="active()" (next)="go(active() + 1)" />
    </div>

    <div class="dots">
      @for (q of questions; track q; let i = $index) {
        <button
          type="button"
          class="dot"
          [class.is-active]="active() === i"
          [attr.aria-current]="active() === i"
          [attr.aria-label]="'home.trust.goTo' | translate: { n: i + 1 }"
          (click)="go(i)"
        ></button>
      }
    </div>
  </div>
</div>
