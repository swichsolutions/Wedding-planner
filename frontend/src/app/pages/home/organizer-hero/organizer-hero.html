<div class="hero">
  <div class="hero__copy">
    <h2 class="hero__title">{{ 'home.organize.title' | translate }}</h2>
    <p class="hero__lead">{{ 'home.organize.leadShort' | translate }}</p>
    <a class="hero__cta" routerLink="/signup" [attr.title]="'home.organize.cta' | translate">
      <span>{{ 'home.organize.cta' | translate }}</span>
      <span aria-hidden="true">↗</span>
    </a>
    <p class="hero__chips">
      <span><i aria-hidden="true">✧</i> {{ 'home.organize.chips.c1' | translate }}</span>
      <span><i aria-hidden="true">♡</i> {{ 'home.organize.chips.c2' | translate }}</span>
      <span><i aria-hidden="true">✓</i> {{ 'home.organize.chips.c3' | translate }}</span>
    </p>
  </div>

  <!-- the phone: a clip of the real planning tool (decorative, made in video/ at the proportions
       of this screen); the poster stands in until it plays and under reduced motion -->
  <div class="stage" aria-hidden="true">
    <div class="stage__glow"></div>
    <div class="phone">
      <div class="phone__screen">
        <app-clip-video src="/media/organizer.mp4" poster="/media/organizer-poster.jpg" />
        <div class="phone__status"><strong>9:41</strong><span>▰ ▮ ◉</span></div>
        <div class="phone__island"></div>
        <span class="phone__home"></span>
      </div>
    </div>
  </div>
</div>
