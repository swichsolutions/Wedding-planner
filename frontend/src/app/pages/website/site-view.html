@if (notFound()) {
  <section class="static-page static-page--center">
    <h1>{{ 'website.notFoundTitle' | translate }}</h1>
    <p>{{ 'website.notFoundBody' | translate }}</p>
    <a class="btn btn--primary" routerLink="/">{{ 'notFound.home' | translate }}</a>
  </section>
} @else if (site(); as s) {
  <app-wedding-site [data]="s" [template]="s.templateKey" />
} @else {
  <!-- loading (client-side navigation) — hold the page shape instead of blank -->
  <div class="sv-skel" aria-hidden="true">
    <div class="skel sv-skel__hero"></div>
    <div class="skel sv-skel__line"></div>
    <div class="skel sv-skel__line sv-skel__line--sub"></div>
  </div>
}
