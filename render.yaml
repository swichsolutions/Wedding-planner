# Render Blueprint — the live API behind https://api.weddingplanner.ge (docs/DEPLOY.md).
#
# The live frontend is NOT here: it runs on Cloudflare Workers (frontend/wrangler.jsonc,
# `npm run deploy:live`). The old free demo frontend on Render was deleted on 2026-11-05;
# `frontend/Dockerfile` still builds the Express/SSR image if anyone wants it elsewhere.
#
# Postgres is NOT defined here on purpose: Render's free Postgres expires after 30 days; the
# database lives on Neon (Frankfurt). Values marked `sync: false` are entered in the dashboard.

services:
  # ---------------------------------------------------------------- .NET 8 API
  - type: web
    name: weddingplanner-api
    runtime: docker
    # Starter: no sleeping after 15 min idle (the free tier wakes in ~1 min, which is fine for a
    # demo and not for a site people use).
    plan: starter
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Production: no Swagger, no demo vendors, no detailed error pages. Migrations still run
      # on startup because of Database__MigrateOnStartup (Program.cs), and the admin account
      # is created if missing from Seed__AdminEmail/Seed__AdminPassword.
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__MigrateOnStartup
        value: "true"
      # Neon → Connection details → ".NET" format (Host=...;Username=...;Password=...;SSL Mode=Require)
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: weddingplanner-api
      - key: Jwt__Audience
        value: weddingplanner-web
      - key: Jwt__ExpireHours
        value: "72"
      - key: Seed__AdminEmail
        value: admin@weddingplanner.ge
      - key: Seed__AdminPassword
        sync: false
      # Render's proxy is the only thing that can reach the container, so trust its
      # X-Forwarded-* headers; otherwise every visitor shares one IP for rate limiting.
      - key: ForwardedHeaders__TrustAll
        value: "true"
      # ---- the site ----
      - key: Cors__AllowedOrigins__0
        value: https://weddingplanner.ge
      - key: Cors__AllowedOrigins__1
        value: https://www.weddingplanner.ge
      - key: Site__PublicOrigin
        value: https://weddingplanner.ge # canonical origin for sitemap.xml and e-mail links
      # ---- photos: Cloudinary (persistent). Without it uploads land on the container's disk
      #      and vanish on every deploy. Dashboard → Environment: ----
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      # ---- Outgoing e-mail (SMTP): "forgot password", partner invites and the /contact form.
      # Without these the API only logs them, and the contact form answers "could not send". ----
      - key: Email__Smtp__Host
        sync: false # e.g. smtp.resend.com
      - key: Email__Smtp__Port
        value: "587"
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__From
        value: no-reply@weddingplanner.ge
      - key: Email__FromName
        value: WeddingPlanner
      # the inbox that receives the /contact form (nothing is stored, the mail is the only copy)
      - key: Email__ContactTo
        value: info@weddingplanner.ge
      # ---- Google sign-in: the same OAuth client id as frontend/src/environments/environment.live.ts
      - key: Google__ClientId
        sync: false
