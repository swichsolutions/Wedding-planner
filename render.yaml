# Render Blueprint — the live API behind https://api.weddingplanner.ge (docs/DEPLOY.md).
#
# The live frontend is NOT here: it runs on Cloudflare Workers (frontend/wrangler.jsonc,
# `npm run deploy:live`). The frontend service at the bottom is the old free demo, kept for
# anyone who wants the whole thing on Render; `frontend/Dockerfile` still builds it.
#
# Postgres is NOT defined here on purpose: Render's free Postgres expires after 30 days; the
# database lives on Neon (Frankfurt). Values marked `sync: false` are entered in the dashboard.

services:
  # ---------------------------------------------------------------- .NET 8 API
  - type: web
    name: weddingplanner-api
    runtime: docker
    # Starter: no sleeping after 15 min idle (the free tier wakes in ~1 min, which is fine for a
    # demo and not for a site people use).
    plan: starter
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Production: no Swagger, no demo vendors, no detailed error pages. Migrations still run
      # on startup because of Database__MigrateOnStartup (Program.cs), and the admin account
      # is created if missing from Seed__AdminEmail/Seed__AdminPassword.
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__MigrateOnStartup
        value: "true"
      # Neon → Connection details → ".NET" format (Host=...;Username=...;Password=...;SSL Mode=Require)
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: weddingplanner-api
      - key: Jwt__Audience
        value: weddingplanner-web
      - key: Jwt__ExpireHours
        value: "72"
      - key: Seed__AdminEmail
        value: admin@weddingplanner.ge
      - key: Seed__AdminPassword
        sync: false
      # Render's proxy is the only thing that can reach the container, so trust its
      # X-Forwarded-* headers; otherwise every visitor shares one IP for rate limiting.
      - key: ForwardedHeaders__TrustAll
        value: "true"
      # ---- the site ----
      - key: Cors__AllowedOrigins__0
        value: https://weddingplanner.ge
      - key: Cors__AllowedOrigins__1
        value: https://www.weddingplanner.ge
      - key: Site__PublicOrigin
        value: https://weddingplanner.ge # canonical origin for sitemap.xml and e-mail links
      # ---- photos: Cloudinary (persistent). Without it uploads land on the container's disk
      #      and vanish on every deploy. Dashboard → Environment: ----
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      # ---- "forgot password" e-mails (SMTP). Without these the API only logs them. ----
      - key: Email__Smtp__Host
        sync: false # e.g. smtp.resend.com
      - key: Email__Smtp__Port
        value: "587"
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__From
        value: no-reply@weddingplanner.ge
      - key: Email__FromName
        value: WeddingPlanner
      # ---- Google sign-in: the same OAuth client id as frontend/src/environments/environment.live.ts
      - key: Google__ClientId
        sync: false

  # ------------------------------------------------------ Angular 21 SSR frontend (demo only)
  # The live site is served by Cloudflare Workers. This free service is the old demo deploy
  # (weddingplanner-web.onrender.com); delete it once the Workers site is up, or keep it as a
  # second preview. Two-pass start: deploy with placeholders, then put the real URLs in.
  - type: web
    name: weddingplanner-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    buildFilter:
      paths:
        - frontend/**
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      # Build arg (Render passes env vars to Docker builds): the API origin compiled into
      # the bundle. Change → "Manual deploy → Clear build cache & deploy".
      - key: API_BASE_URL
        value: https://api.weddingplanner.ge
      # Angular SSR host allowlist (runtime, comma-separated, wildcards allowed). Without a
      # match the server silently falls back to client-side rendering.
      - key: NG_ALLOWED_HOSTS
        value: "*.onrender.com"
      # @angular/ssr drops to client-side rendering on ANY x-forwarded-* header it wasn't told
      # to trust, so list the whole set Render's proxy may send.
      - key: NG_TRUST_PROXY_HEADERS
        value: "x-forwarded-for,x-forwarded-host,x-forwarded-port,x-forwarded-proto,x-forwarded-prefix"
      # Google sign-in button: leave empty to hide it; set a client id whose authorized
      # origins include the frontend URL to enable it (also set Google__ClientId on the API).
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: NODE_ENV
        value: production
